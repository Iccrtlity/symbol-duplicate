<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Symbol Duplicate</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
      color: #e8e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .card {
      background: #1a1a24;
      border: 1px solid #2e2e44;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.03em;
      color: #c8b6ff;
    }

    .row {
      display: flex;
      gap: 0.75rem;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #9090b0;
    }

    input {
      background: #12121a;
      border: 1px solid #2e2e44;
      border-radius: 8px;
      color: #e8e8f0;
      font-size: 1rem;
      padding: 0.55rem 0.75rem;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #7b5ea7; }

    #symbol-input { flex: 0 0 auto; width: 88px; font-size: 1.4rem; text-align: center; }
    #count-input  { flex: 1; }

    #output {
      background: #12121a;
      border: 1px solid #2e2e44;
      border-radius: 8px;
      min-height: 80px;
      max-height: 220px;
      overflow-y: auto;
      padding: 0.75rem;
      font-size: 1.2rem;
      word-break: break-all;
      line-height: 1.6;
      color: #e8e8f0;
      user-select: all;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
    }

    button {
      flex: 1;
      padding: 0.65rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    #generate-btn {
      background: #7b5ea7;
      color: #fff;
    }

    #generate-btn:hover { opacity: 0.88; }

    #copy-btn {
      background: #2e2e44;
      color: #c8b6ff;
    }

    #copy-btn:hover { opacity: 0.8; }

    #copy-btn.copied {
      background: #2a4a2a;
      color: #7dda7d;
    }

    .hint {
      font-size: 0.75rem;
      color: #55556a;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Symbol Duplicate</h1>

    <div class="row">
      <label>
        Symbol
        <input id="symbol-input" type="text" maxlength="2" placeholder="★" />
      </label>
      <label style="flex:1">
        Count
        <input id="count-input" type="number" min="1" max="10000" value="10" />
      </label>
    </div>

    <div id="output"></div>

    <div class="actions">
      <button id="generate-btn">Generate</button>
      <button id="copy-btn">Copy</button>
    </div>

    <p class="hint">Enter any symbol or emoji and choose how many times to repeat it.</p>
  </div>

  <script>
    const symbolInput = document.getElementById('symbol-input');
    const countInput  = document.getElementById('count-input');
    const output      = document.getElementById('output');
    const generateBtn = document.getElementById('generate-btn');
    const copyBtn     = document.getElementById('copy-btn');

    function generate() {
      const symbol = symbolInput.value || '★';
      const count  = Math.min(Math.max(parseInt(countInput.value, 10) || 1, 1), 10000);
      output.textContent = symbol.repeat(count);
    }

    function copyOutput() {
      const text = output.textContent;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 1500);
      }).catch(() => {
        copyBtn.textContent = 'Failed';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
      });
    }

    generateBtn.addEventListener('click', generate);
    copyBtn.addEventListener('click', copyOutput);
    symbolInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
    countInput.addEventListener('keydown',  (e) => { if (e.key === 'Enter') generate(); });

    generate();
  </script>
</body>
</html>
