<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Symbol Duplicate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>Symbol Duplicate</h1>

    <div class="row">
      <label>
        Symbol
        <input id="symbol-input" type="text" maxlength="2" placeholder="★" />
      </label>
      <label style="flex:1">
        Count
        <input id="count-input" type="number" min="1" max="10000" value="10" />
      </label>
    </div>

    <div id="output"></div>

    <div class="actions">
      <button id="generate-btn">Generate</button>
      <button id="copy-btn">Copy</button>
    </div>

    <p class="hint">Enter any symbol or emoji and choose how many times to repeat it.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
